[project]
name = "pythonizeyaml"
version = "0.4.0"
description = "A YAML library with a PyYAML-compatible API that preserves comments, indentation, and scalar styles across a load/dump round trip."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<4.0"
authors = [{ name = "PythonizeYAML contributors" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
homepage = "https://github.com/ECSDevs/PythonizeYAML"
repository = "https://github.com/ECSDevs/PythonizeYAML"

[tool.poetry]
packages = [{ include = "pythonizeyaml", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
maturin = ">=1.15,<2"
pyyaml = "^6.0.3"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "pythonizeyaml._native"
manifest-path = "rust/Cargo.toml"
features = ["extension-module"]
exclude = ["**/__pycache__/**", "**/*.pyc", "rust/target/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]



name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assert pyproject.toml, Cargo.toml, and __init__.py versions match
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          def extract(path, pattern):
              match = re.search(pattern, pathlib.Path(path).read_text(encoding="utf-8"), re.M)
              if not match:
                  sys.exit(f"could not find version in {path}")
              return match.group(1)

          versions = {
              "pyproject.toml": extract("pyproject.toml", r'^version\s*=\s*"([^"]+)"'),
              "rust/Cargo.toml": extract("rust/Cargo.toml", r'^version\s*=\s*"([^"]+)"'),
              "src/pythonizeyaml/__init__.py": extract(
                  "src/pythonizeyaml/__init__.py", r'^__version__\s*=\s*"([^"]+)"'
              ),
          }
          unique = set(versions.values())
          for path, version in versions.items():
              print(f"{path}: {version}")
          if len(unique) != 1:
              sys.exit(f"version mismatch: {versions}")
          PY

  test:
    strategy:
      fail-fast: false
      matrix:
        # Only the bounds of the supported range (requires-python >=3.10,<4.0).
        python-version: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install poetry maturin
      - run: poetry install --with dev
      # Source (debug) build only; wheels are built and tested by release.yml.
      - run: poetry run maturin develop
      - run: poetry run pytest -q
      - run: poetry run python smoke_check.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Provides libpython for the test binary.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      # --no-default-features drops extension-module so the test binary links
      # libpython instead of leaving Python symbols to the interpreter.
      - run: cargo test --manifest-path rust/Cargo.toml --no-default-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.83.0"
      # `+1.83.0` beats the repo's rust-toolchain.toml (channel = stable).
      - run: cargo +1.83.0 check --manifest-path rust/Cargo.toml


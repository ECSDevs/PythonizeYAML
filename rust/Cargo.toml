[package]
name = "pythonizeyaml-native"
version = "0.3.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Native parser and emitter for pythonizeyaml"
autoexamples = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
bigdecimal = "0.4.10"
num-bigint = "0.4.6"
num-rational = "0.4.2"
num-traits = "0.2.19"
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"] }
thiserror = "2.0.21"







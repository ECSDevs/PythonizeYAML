[package]
name = "pythonizeyaml-native"
version = "0.6.1"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Native parser and emitter for pythonizeyaml"
repository = "https://github.com/ECSDevs/PythonizeYAML"
readme = "../README.md"
keywords = ["yaml", "pyyaml", "parser", "serialization", "round-trip"]
categories = ["encoding", "parser-implementations"]
autoexamples = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[features]
# extension-module leaves Python symbols to the interpreter, which makes
# executables (cargo test) fail to link on Linux/macOS; run tests with
# --no-default-features so libpython is linked instead. Maturin keeps the
# default on.
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[dependencies]
base64 = "0.22.1"
bigdecimal = "0.4.10"
num-bigint = "0.4.6"
num-rational = "0.4.2"
num-traits = "0.2.19"
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
thiserror = "2.0.21"
